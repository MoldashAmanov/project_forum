<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Форум</title>
    </head>
    <body>
        <h1>Разделы проекта</h1>
        <ul>
            {% for board in boards %}
            <li><a href="/boards/{{ board.pk }}/"><strong>{{ board.name }}</strong></a> — {{ board.description }}</li>
        {% empty %}
        <li>Разделов пока нет</li>
        {% endfor %}
        </ul>
    </body>
</html>
