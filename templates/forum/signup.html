{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body">
                <h1 class="h3 mb-3">Вход</h1>
                <form method="post" action="{% url 'forum:signup' %}">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary v-100">Войти</button>
                </form>
                <p class="mt-3 mb-0">Нет аккаунта? <a href="{% url 'forum:signup %'}">Регистрация</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
