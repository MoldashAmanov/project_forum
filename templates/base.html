<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Форум{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-le navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'forum:home' %}">💬 Форум</a>
        <ul class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
            <li class="nav-item"><span class="navbar-text me-3">Привет, {{ user.username }}!</span></li>
            <li class="nav-item">
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="nav-link btn btn-link">Выйти</button>
                </form>
            </li>
            {% else %}
            <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Войти</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'forum:signup' %}">Регистрация</a></li>
            {% endif %}
        </ul>
    </div>
</nav>
<main class="container mt-4">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
